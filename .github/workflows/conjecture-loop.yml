name: Hourly Conjecture Research Loop

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  conjecture-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run one conjecture iteration
        run: |
          python3 loops/hourly_loop.py

      - name: Commit research state
        run: |
          git config user.name "ConjectureIteratingMachine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "auto: conjecture research iteration"
          git push
